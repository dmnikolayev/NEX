<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071014">
  <title>NEX Living House</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="scene" class="scene" aria-label="NEX Living House">
    <img class="scene-bg" src="assets/house-concept-v5.png" alt="Будинок NEX">
    <div class="scene-vignette"></div>

    <header class="scene-header">
      <section class="clock-block">
        <b id="clock">--:--</b>
        <span id="date">--</span>
      </section>

      <section class="weather" aria-label="Погода на три дні">
        <div class="weather-now">
          <span class="weather-icon">☁</span>
          <div><b id="weatherTemp">+18°</b><small id="weatherState">Хмарно</small></div>
        </div>
        <div class="forecast" id="forecastRows"></div>
      </section>
    </header>

    <aside id="storyRail" class="story-rail glass" aria-live="polite">
      <div class="story-head">СТАН БУДИНКУ</div>
      <div id="storyPage" class="story-page"></div>
      <div class="story-foot">
        <span id="storyCountdown">Оновлення через 30 сек</span>
        <div id="storyDots" class="story-dots"></div>
      </div>
    </aside>

    <svg class="energy-layer" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <path id="flowGrid" class="energy-path grid-flow" d="M 310 760 C 470 760, 690 760, 1210 730" />
      <path id="flowSolar" class="energy-path solar-flow" d="M 1020 365 C 1050 480, 1110 570, 1210 690" />
      <path id="flowHouse" class="energy-path house-flow" d="M 1210 730 C 1070 730, 960 735, 855 735" />
      <path id="flowBattery" class="energy-path battery-flow" d="M 1250 735 C 1320 735, 1380 735, 1440 735" />
    </svg>

    <section class="device device-grid glass" data-device="grid">
      <div class="device-title">ТРАНСФОРМАТОР</div>
      <div class="signal-pair"><i class="lamp red"></i><i id="gridLamp" class="lamp green"></i></div>
      <div class="device-row"><span>Напруга</span><b id="gridVoltage">230 В</b></div>
      <div class="device-row"><span>Споживання</span><b id="gridPower">821 Вт</b></div>
    </section>

    <section class="device device-starlink glass" data-device="starlink">
      <div class="device-title">STARLINK</div>
      <b id="internetStatus" class="online">Online</b>
      <span id="internetPing">27 ms</span>
    </section>

    <section class="device device-solar glass" data-device="solar">
      <div class="device-inline"><span class="sun-icon">☀</span><b id="solarPower">1.8 кВт</b></div>
      <small id="solarToday">Сьогодні: 6.4 кВт·год</small>
    </section>

    <section class="device device-house glass" data-device="house">
      <span class="house-icon">⌂</span><b id="housePower">821 Вт</b>
    </section>

    <section class="device device-deye glass" data-device="deye">
      <div class="status-dot"></div>
      <b id="deyePower">1.8 кВт</b>
      <small id="deyeMode">Сонячний режим</small>
    </section>

    <section class="device device-battery glass" data-device="battery">
      <div class="status-dot"></div>
      <b id="batterySoc">82%</b>
      <small id="batteryRuntime">≈ 13 год</small>
    </section>

    <div id="houseSpirit" class="house-spirit" aria-live="polite">
      <div class="cat"><span>••</span></div>
      <div id="houseSpiritBubble" class="spirit-bubble"></div>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="js/house-state.js"></script>
  <script src="js/house-spirit.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
