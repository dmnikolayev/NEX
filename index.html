<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>NEX Living House</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="scene" class="scene" aria-label="NEX Living House">
    <img id="scene-background" class="scene__background" src="assets/house-bg-v2.png" alt="">
    <div class="scene__shade" aria-hidden="true"></div>
    <canvas id="energy-flow" class="energy-flow" aria-hidden="true"></canvas>

    <div class="brand">
      <strong>NEX</strong><span>ЖИВИЙ БУДИНОК</span>
    </div>

    <header class="clock" data-node="clock">
      <time id="clock-time">--:--</time>
      <div id="clock-date">—</div>
    </header>

    <section id="house-log" class="house-log" data-node="houseLog" aria-label="Події будинку"></section>

    <section id="grid-hud" class="device-label device-label--grid" data-node="grid" aria-label="Мережа">
      <div class="device-label__head"><span>МЕРЕЖА</span><i id="grid-lamp" class="status-lamp"></i></div>
      <strong id="grid-voltage">—</strong>
    </section>

    <section id="solar-hud" class="panel-readout" data-node="solar" aria-label="Сонячні панелі">
      <strong id="solar-power">—</strong>
      <small><span id="solar-today">—</span> СЬОГОДНІ</small>
    </section>

    <section id="deye-display" class="device-display device-display--deye" data-node="deye" aria-label="Deye">
      <div class="deye-ring" id="deye-ring">
        <strong id="deye-load">—</strong>
        <small id="deye-temp">—</small>
      </div>
    </section>

    <section id="battery-display" class="device-display device-display--battery" data-node="battery" aria-label="Батарея">
      <div class="battery-bars" id="battery-bars" aria-hidden="true"></div>
      <strong id="battery-runtime">—</strong>
      <small id="battery-temp">—</small>
      <div id="battery-flow" class="battery-flow" hidden><span id="battery-arrow">→</span><b id="battery-power">—</b></div>
    </section>


    <button id="nex-cat" class="nex-cat" type="button" aria-label="Кіт NEX" title="NEX">
      <svg viewBox="0 0 180 110" aria-hidden="true">
        <path class="cat-shadow" d="M26 91c24-12 91-10 126 0-22 14-104 16-126 0Z"/>
        <path class="cat-tail" d="M126 72c30-14 33-43 12-51-13-5-22 6-15 15 4 5 13 2 11-5"/>
        <path class="cat-body" d="M46 79c1-28 23-47 53-43 28 3 44 22 39 49-21 9-72 10-92-6Z"/>
        <path class="cat-chest" d="M78 44c10-8 27-7 37 3l-7 39H78Z"/>
        <path class="cat-head" d="M60 41c-1-23 15-36 35-31 18-5 35 8 35 31 0 20-14 32-35 32S60 61 60 41Z"/>
        <path class="cat-ear cat-ear--left" d="M66 25 61 4 82 16Z"/>
        <path class="cat-ear cat-ear--right" d="m108 16 21-12-5 23Z"/>
        <path class="cat-muzzle" d="M78 48c8-8 25-8 33 0-4 12-29 12-33 0Z"/>
        <circle class="cat-eye" cx="80" cy="37" r="3.8"/>
        <circle class="cat-eye" cx="109" cy="37" r="3.8"/>
        <path class="cat-nose" d="m94 47 5 0-2.5 4Z"/>
        <path class="cat-paw" d="M54 80c14-4 27-3 35 6-11 9-28 9-39 1Z"/>
      </svg>
    </button>

    <section id="nex-pulse" class="nex-pulse" aria-label="Енергетичний баланс будинку">
      <div class="nex-pulse__head">
        <span class="nex-pulse__eyebrow">NEX PULSE</span>
        <strong id="pulse-mode">Будинок стабільний</strong>
        <button id="pulse-details" class="nex-pulse__button" type="button" aria-expanded="false">СИСТЕМА</button>
      </div>
      <div class="nex-pulse__rail">
        <article class="pulse-metric"><span>МЕРЕЖА</span><strong id="pulse-grid">—</strong></article>
        <i class="pulse-arrow">→</i>
        <article class="pulse-metric pulse-metric--solar"><span>СОНЦЕ</span><strong id="pulse-solar">—</strong></article>
        <i class="pulse-arrow">→</i>
        <article class="pulse-metric pulse-metric--home"><span>БУДИНОК</span><strong id="pulse-home">—</strong></article>
        <article class="pulse-battery" aria-label="Заряд батареї">
          <div id="pulse-soc-ring" class="pulse-battery__ring"><strong id="pulse-soc">—</strong></div>
          <span id="pulse-battery-state">АКУМУЛЯТОР</span>
        </article>
      </div>
      <div id="pulse-system" class="pulse-system" hidden>
        <div><span>API</span><b id="system-api">DEMO</b></div>
        <div><span>МЕРЕЖА</span><b id="system-grid">В НОРМІ</b></div>
        <div><span>ІНВЕРТОР</span><b id="system-inverter">—</b></div>
      </div>
    </section>

    <div id="connection-badge" class="connection-badge">ДЕМО</div>
    <div id="house-spirit" class="house-spirit" role="status"></div>
  </main>

  <script src="config.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
